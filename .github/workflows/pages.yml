name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest css js icons _site/
          touch _site/.nojekyll
          # Version + Cache-Busting: jede Datei bekommt ?v=<commit> in der URL
          V="${GITHUB_SHA::8}"
          echo "{\"version\":\"$V\"}" > _site/version.json
          sed -i "s|name=\"app-version\" content=\"dev\"|name=\"app-version\" content=\"$V\"|" _site/index.html
          sed -i -E "s#(href|src)=\"(css/style\.css|js/main\.js|manifest\.webmanifest)\"#\1=\"\2?v=$V\"#g" _site/index.html
          sed -i -E "s#from '(\./[A-Za-z]+\.js)'#from '\1?v=$V'#g" _site/js/*.js
          grep -q "content=\"$V\"" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
